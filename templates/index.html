<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-light">

    <div class="mt-12">
        <div class="row justify-content-center">
            <div class="col-md-4 col-lg-4"> <!-- Colonna per il modulo di ricerca -->
                <div class="card shadow-lg p-4">
                    <h2 class="text-center mb-4">Travel Planner AI</h2>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Città da visitare:</label>
                            <input type="text" name="city" class="form-control" required placeholder="Es. Roma, Venezia...">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Numero di giorni:</label>
                            <input type="number" name="days" class="form-control" min="1" required placeholder="Es. 3 giorni">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Budget:</label>
                            <select name="budget" class="form-select">
                                <option value="Economico">Economico</option>
                                <option value="Medio">Medio</option>
                                <option value="Lussuoso">Lussuoso</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Attività Preferite:</label>
                            <ul class="list-unstyled">
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" name="activities" value="Natura" id="activity-natura">
                                    <label class="form-check-label" for="activity-natura">Natura</label>
                                </li>
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" name="activities" value="Vita Notturna" id="activity-nightlife">
                                    <label class="form-check-label" for="activity-nightlife">Vita Notturna</label>
                                </li>
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" name="activities" value="Musei" id="activity-museums">
                                    <label class="form-check-label" for="activity-museums">Musei</label>
                                </li>
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" name="activities" value="Gastronomia" id="activity-food">
                                    <label class="form-check-label" for="activity-food">Gastronomia</label>
                                </li>
                                <li class="form-check">
                                    <input class="form-check-input" type="checkbox" name="activities" value="Shopping" id="activity-shopping">
                                    <label class="form-check-label" for="activity-shopping">Shopping</label>
                                </li>
                            </ul>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Genera il Piano</button>
                    </form>
                </div>
            </div>

            <div class="col-md-8 col-lg-8">
                <h2>Risposta:</h2>
                <div class="alert alert-info mt-4" id="pensando-text"></div>
                
                <div class="alert alert-success mt-4" id="response-ai" style="white-space: pre-wrap;"><p>Di seguito sarà generata la risposta...</p></div>

        </div>
    </div>

</body>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.querySelector("form");
        const responseBox = document.getElementById("response-ai");
        const pensando = document.getElementById("pensando-text");
    
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            responseBox.innerHTML = "";
            pensando.textContent = "Sto pensando...";
    
            const formData = new FormData(form);
            const response = await fetch("/stream", {
                method: "POST",
                body: formData
            });
    
            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
    
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const text = decoder.decode(value);
                const lines = text.split("\n").filter(line => line.startsWith("data:"));
                for (let line of lines) {
                    const content = line.replace("data: ", "");
                    responseBox.innerHTML += content;
                }
            }
    
            pensando.textContent = "";
        });
    });
    eventSource.onmessage = function(event) {
    output.innerHTML += event.data;
    output.scrollTop = output.scrollHeight;
    };
    </script>
    

</html>
